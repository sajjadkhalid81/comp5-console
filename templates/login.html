<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — COMP5 Console</title>
<style>
  :root{
    --navy:#1a2744;
    --navy-dark:#0f1b36;
    --amber:#f59e0b;
    --border:#e5e7eb;
    --text:#111827;
    --text-muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--navy);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  .card{
    width:100%;max-width:340px;
    background:#fff;
    border-radius:12px;
    padding:28px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .logo{
    width:38px;height:38px;border-radius:9px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--navy-dark);font-size:18px;
    margin-bottom:14px;
  }
  h1{font-size:16px;color:var(--text);margin-bottom:2px;}
  p.sub{font-size:12px;color:var(--text-muted);margin-bottom:22px;}
  label{font-size:12px;color:var(--text);font-weight:600;display:block;margin-bottom:5px;}
  input{
    width:100%;padding:9px 11px;
    border:1px solid var(--border);border-radius:7px;
    font-size:13px;margin-bottom:14px;
    outline:none;
  }
  input:focus{border-color:var(--navy);}
  button{
    width:100%;padding:10px;
    background:var(--navy);color:var(--amber);
    border:none;border-radius:7px;
    font-size:13px;font-weight:600;
    cursor:pointer;
  }
  button:hover{background:var(--navy-dark);}
  .error{
    background:#fee2e2;color:#b91c1c;
    font-size:12px;padding:8px 10px;border-radius:6px;
    margin-bottom:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">✓</div>
    <h1>COMP5 Console</h1>
    <p class="sub">Sign in to continue</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
